name = "gsp32-telemetry"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
account_id = "3d102f222e99f035a8c29073fe6e6300"

[[d1_databases]]
binding = "DB"
database_name = "gsp32-telemetry"
database_id = "cc160c95-a86e-4e56-a5d9-cb212d8e6432"


# V84: burst limit per hashed client IP (Cloudflare rate-limit binding; the Worker falls back to its hourly limit without it)
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "8401"
simple = { limit = 10, period = 60 }

# V84: per-client hourly counts in memory (one Durable Object per hashed IP; it never uses storage)
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v84-limiter"
new_sqlite_classes = ["Limiter"]
